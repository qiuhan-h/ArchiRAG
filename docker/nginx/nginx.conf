"""ArchiRAG 生产 Nginx 反向代理配置。

职责：
  - 终结 HTTPS（TLS），HTTP 自动 301 跳 HTTPS
  - /api/* → backend:8000（含 SSE 流式的长连接支持）
  - / → frontend:8501（Streamlit，WebSocket 透传）
  - 安全头（HSTS、frame-ancestors 等）

使用方式：
  1. 将 SSL 证书放到 docker/nginx/ssl/（fullchain.pem + privkey.pem）
  2. docker compose --profile prod up -d
  3. 修改 server_name 为你的真实域名
"""

# ---------------------------------------------------------------------------
# HTTP → HTTPS 重定向
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS 主服务
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;  # ← 部署时改为真实域名

    # --- TLS 证书 ---
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- 安全头 ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 文件上传大小 ---
    client_max_body_size 50m;

    # --- API 反代（含 SSE 流式） ---
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式：关闭缓冲，长连接超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # /docs 静态资源
        location /api/docs {
            proxy_pass http://backend:8000/docs;
        }
        location /api/openapi.json {
            proxy_pass http://backend:8000/openapi.json;
        }
    }

    # --- FastAPI 文档直接访问（不经过 /api 前缀） ---
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    # --- Streamlit 前端 ---
    location / {
        proxy_pass http://frontend:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit 用 WebSocket 通信
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
