services:
  # ===== Nginx 反向代理（仅生产模式） =====
  # 启动生产模式：docker compose --profile prod up -d
  # 本地调试：docker compose up -d（无 Nginx，直连端口）
  nginx:
    profiles: ["prod"]
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== 后端 API（单 worker） =====
  backend:
    image: docker-backend:${BACKEND_TAG:-latest}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_EMBED: ${INSTALL_EMBED:-false}
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - MYSQL_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/building_rag
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      - WATCH_DIR=/app/data/raw
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - SQLITE_PATH=/app/data/building_rag.db
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=https://hf-mirror.com
      # 生产模式：前端通过服务名访问
      - ARCHIRAG_API_BASE=http://backend:8000/api
    volumes:
      - ../data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

  # 一次性数据导入（bge 镜像构建后）：
  #   docker compose run --rm backend python -m scripts.import_jsonl data/seed/shu_ju.jsonl

  # ===== 文件监控（独立进程） =====
  watcher:
    image: docker-backend:${BACKEND_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_EMBED: ${INSTALL_EMBED:-false}
    command: ["python", "-m", "app.watcher.file_monitor"]
    env_file:
      - ../.env
    environment:
      - MYSQL_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@db:3306/building_rag
      - REDIS_URL=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379/0
      - WATCH_DIR=/app/data/raw
      - FAISS_INDEX_PATH=/app/data/faiss_index
      - SQLITE_PATH=/app/data/building_rag.db
      - HF_HOME=/root/.cache/huggingface
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ../data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ===== 前端 =====
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    env_file:
      - ../.env
    environment:
      - ARCHIRAG_API_BASE=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  # ===== MySQL =====
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: building_rag
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    command: >
      sh -c '
      if [ -n "$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$REDIS_PASSWORD"
      else
        redis-server
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging:
      <<: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  mysql_data:
  redis_data:
  hf_cache:
